<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="明清檔案史期中報告〈「監」守自盜〉：以太監曾祿的視角，經歷乾隆九年養心殿內庫失竊案。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>內務府當差情形調查</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one official survey card, centered. The page "ages" with dread level 0-5:
   clean office form -> yellowed paper -> dark room. Committed single look per level, colors set explicitly. */
:root {
  color-scheme: light;
  --bg: #f3f1ec;
  --card: #ffffff;
  --ink: #3a3a3a;
  --dim: #8a8a8a;
  --line: #e4e1da;
  --btn: #ffffff;
  --btn-line: #dedad2;
  --red: #b3261e;
  --vignette: 0;
  --noise: 0;
  --font-form: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-brush: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", serif;
}
body[data-dread="1"] { --bg: #ece6da; --card: #fcf9f2; --line: #e2dccd; --btn-line: #d9d1bf; }
body[data-dread="2"] { --bg: #d8ccb2; --card: #f2e9d5; --ink: #3a3128; --dim: #7d7260; --line: #d6c9ab; --btn: #f7f0e0; --btn-line: #cbbb98; --vignette: .15; }
body[data-dread="3"] { --bg: #5b4a3b; --card: #e8dabd; --ink: #2f261d; --dim: #6e6150; --line: #cdbb94; --btn: #efe3c8; --btn-line: #bba77e; --vignette: .35; --noise: .04; }
body[data-dread="4"] { --bg: #1d1613; --card: #d9c8a4; --ink: #2a2018; --dim: #5e5140; --line: #bfa97c; --btn: #e3d3b0; --btn-line: #a99266; --vignette: .6; --noise: .08; color-scheme: dark; }
body[data-dread="5"] { --bg: #090707; --card: #151111; --ink: #d8cdbd; --dim: #8a7d6c; --line: #2c2420; --btn: #1d1716; --btn-line: #3a2f2a; --vignette: .75; --noise: .05; color-scheme: dark; }
body[data-dread="white"] { --bg: #ffffff; --card: #ffffff; --ink: #222; --dim: #999; --line: #ffffff; --vignette: 0; --noise: 0; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-form);
  font-size: 16px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6vh 40px;
  transition: background-color 2.2s ease, color 2.2s ease;
  overflow-x: hidden;
}
#vignette, #noise { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#vignette {
  background: radial-gradient(ellipse at center, transparent 45%, rgba(60,0,0,1) 100%);
  opacity: var(--vignette);
  transition: opacity 2.2s ease;
}
#noise { opacity: var(--noise); mix-blend-mode: multiply; transition: opacity 2s; image-rendering: pixelated; width: 100%; height: 100%; }
body[data-dread="5"] #noise { mix-blend-mode: screen; }
#flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; z-index: 6; }
#flash.on { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .35; } 100% { opacity: 0; } }

#mute {
  position: fixed; z-index: 10;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  font: 500 12px var(--font-form);
  color: var(--dim); background: transparent;
  border: 1px solid var(--btn-line); border-radius: 999px;
  padding: 4px 12px; cursor: pointer;
  transition: color 2s, border-color 2s;
}
#mute[hidden] { display: none; }

.card {
  position: relative; z-index: 2;
  max-width: 560px; margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 26px 26px 20px;
  display: flex; flex-direction: column; gap: 12px;
  transition: background-color 2.2s ease, border-color 2.2s ease;
}
body[data-dread="white"] .card { border-color: transparent; }
.card.in > * { animation: fadeIn .9s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.title { font-size: 22px; font-weight: 700; text-align: center; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.sub { font-size: 13px; color: var(--dim); margin: 0; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.intro p { margin: 0 0 6px; font-size: 15.5px; color: var(--ink); }
.q { font-size: 18px; line-height: 1.6; margin: 0; min-height: 1.6em; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt {
  font: 400 16.5px var(--font-form);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--btn-line);
  border-radius: 8px;
  padding: 10px 14px;
  text-align: left;
  cursor: pointer;
  transition: background .2s, border-color .2s, opacity .4s, filter 1s;
}
.opt:hover:not([disabled]) { border-color: var(--dim); }
.opt:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }
.opt[disabled] { cursor: default; }
.opt.sel { border-color: var(--dim); }
.opt.gone { opacity: 0; height: 0; padding: 0; margin: 0; border: 0; overflow: hidden; }
.opt.center { text-align: center; }
.fb { font-size: 15.5px; color: var(--dim); min-height: 1.6em; margin: 0; }
.fb.red, .red { color: var(--red); }
.brush { font-family: var(--font-brush); }
.quote {
  font-family: var(--font-brush);
  font-size: 19px; line-height: 1.9;
  margin: 0;
}
.seal-big {
  font-family: var(--font-brush); font-weight: 700;
  color: var(--red);
  font-size: clamp(44px, 14vw, 72px);
  text-align: center; letter-spacing: .15em;
  margin: 10px 0;
  animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.typing::after { content: "▍"; opacity: .5; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  10%, 90% { transform: translate(-2px, 1px); }
  20%, 80% { transform: translate(4px, -2px); }
  30%, 50%, 70% { transform: translate(-7px, 2px); }
  40%, 60% { transform: translate(7px, -1px); }
}
.glitch { animation: glitch 1.6s infinite steps(1); }
@keyframes glitch {
  0%, 86%, 100% { text-shadow: none; transform: none; }
  88% { text-shadow: 2px 0 rgba(179,38,30,.8), -2px 0 rgba(30,90,120,.6); transform: translateX(1px); }
  92% { text-shadow: -3px 0 rgba(179,38,30,.8), 2px 0 rgba(30,90,120,.6); transform: translateX(-2px); }
  95% { text-shadow: none; transform: skewX(-6deg); }
}
.breathe { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%,100% { color: var(--red); } 50% { color: #5e0d08; } }
.blur-out { filter: blur(3px); opacity: .35; }

/* full-screen "我沒有" */
#blood {
  position: fixed; inset: 0; z-index: 8;
  background: #070303;
  overflow: hidden;
  display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px));
  gap: 0 6px;
  line-height: 1;
}
#blood[hidden] { display: none; }
#blood span {
  font-family: var(--font-brush); font-weight: 700;
  color: #9d0b0b;
  text-shadow: 0 0 1px #2a0000, 0 3px 0 #5c0303, 0 6px 6px rgba(120,0,0,.6);
  display: inline-block;
  transform-origin: top center;
  animation: drip 2.4s ease-in forwards;
  white-space: nowrap;
}
#blood span.big { color: #c40f0f; }
@keyframes drip { from { transform: scaleY(.9) translateY(-4px); filter: blur(.4px); } to { transform: scaleY(1.18) translateY(3px); filter: blur(0); } }
#blood canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .22; mix-blend-mode: screen; pointer-events: none; image-rendering: pixelated; }
#blood.flicker { animation: bflicker .12s steps(1) infinite; }
@keyframes bflicker { 50% { filter: brightness(1.6) contrast(1.4); } }
@media (prefers-reduced-motion: reduce) { #blood span, #blood.flicker { animation: none !important; } }

/* final dossier */
.dossier { display: flex; flex-direction: column; gap: 12px; }
.dossier h2 { font-size: 21px; margin: 0; text-wrap: balance; }
.dossier h3 { font-size: 16px; margin: 10px 0 0; padding-top: 12px; border-top: 1px solid var(--line); letter-spacing: .05em; }
.dossier p { margin: 0; }
.dossier ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.dossier li { font-size: 15px; }
.dossier .orig { background: rgba(0,0,0,.04); border-left: 3px solid var(--red); padding: 10px 12px; border-radius: 4px; font-family: var(--font-brush); font-size: 16.5px; }
.dossier .small { font-size: 13px; color: var(--dim); }
.footer { text-align: center; font-size: 12px; color: var(--dim); margin-top: 18px; position: relative; z-index: 2; transition: color 2s; }

@media (prefers-reduced-motion: reduce) {
  .shake, .glitch, .breathe, .seal-big, .card.in > * { animation: none !important; }
}
</style>

</head>
<body>
<div id="vignette"></div>
<canvas id="noise" width="160" height="160"></canvas>
<div id="flash"></div>
<div id="blood" hidden aria-hidden="true"></div>
<button id="mute" hidden>音效：開</button>
<main class="card" id="card" aria-live="polite"></main>
<p class="footer" id="footer">明清檔案史期中報告　〈「監」守自盜：清代太監與宮中竊案〉</p>

<script>
/* ===== 配樂設定：找到配樂後，把檔名填進來（例如 "music.mp3"），留空就用合成音效 ===== */
const MUSIC_URL = "music.mp3";

const card = document.getElementById("card");
const muteBtn = document.getElementById("mute");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPEED = window.__fast ? 0.02 : 1;
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED));

/* ---------- audio ---------- */
const A = { ctx: null, master: null, drone: null, hiss: null, music: null, muted: false };
const DRONE = [0, .035, .07, .12, .19, .26];
function initAudio() {
  if (A.ctx) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    A.ctx = new C();
    A.master = A.ctx.createGain(); A.master.gain.value = .8; A.master.connect(A.ctx.destination);
    // low drone: two detuned sines through a lowpass
    A.drone = A.ctx.createGain(); A.drone.gain.value = 0;
    const lp = A.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180;
    [55, 58.4, 110.6].forEach((f, i) => {
      const o = A.ctx.createOscillator(); o.type = i === 2 ? "triangle" : "sine"; o.frequency.value = f;
      const g = A.ctx.createGain(); g.gain.value = i === 2 ? .25 : .6;
      o.connect(g).connect(lp); o.start();
    });
    lp.connect(A.drone).connect(A.master);
    // room hiss
    const buf = A.ctx.createBuffer(1, A.ctx.sampleRate * 2, A.ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = A.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = A.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500; bp.Q.value = .7;
    A.hiss = A.ctx.createGain(); A.hiss.gain.value = 0;
    src.connect(bp).connect(A.hiss).connect(A.master); src.start();
    A.noiseBuf = buf;
    if (MUSIC_URL) {
      A.music = new Audio(MUSIC_URL); A.music.loop = true; A.music.volume = 0;
      A.music.play().catch(() => {});
    }
  } catch (e) { A.ctx = null; }
  muteBtn.hidden = false;
}
function setLevel(n) {
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  const v = typeof n === "number" ? DRONE[n] : 0;
  A.drone.gain.setTargetAtTime(A.music ? 0 : v, t, 1.2);
  A.hiss.gain.setTargetAtTime(A.music ? 0 : v * .25, t, 1.2);
  if (A.music) fadeMusic(typeof n === "number" ? MUSIC_VOL[n] : 0, n === "white" ? 300 : 2500);
}
const MUSIC_VOL = [.06, .12, .22, .38, .58, .75];
let musicFade = null;
function fadeMusic(target, ms) {
  if (!A.music) return;
  clearInterval(musicFade);
  const start = A.music.volume, t0 = performance.now();
  musicFade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    A.music.volume = Math.max(0, Math.min(1, start + (target - start) * k));
    if (k >= 1) clearInterval(musicFade);
  }, 50);
}
function tick() {
  if (!A.ctx || A.muted) return;
  const t = A.ctx.currentTime;
  const s = A.ctx.createBufferSource(); s.buffer = A.noiseBuf;
  const hp = A.ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1600;
  const g = A.ctx.createGain(); g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.0001, t + .035);
  s.connect(hp).connect(g).connect(A.master); s.start(t, Math.random()); s.stop(t + .045);
  // small wooden body under the click
  const o = A.ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(900 + Math.random() * 200, t);
  const og = A.ctx.createGain(); og.gain.setValueAtTime(.05, t); og.gain.exponentialRampToValueAtTime(.0001, t + .025);
  o.connect(og).connect(A.master); o.start(t); o.stop(t + .03);
}
/* distant cane strike, heard through a wall */
function cane(vol = .7) {
  if (!A.ctx || A.muted) return;
  const t = A.ctx.currentTime;
  if (!A.wall) {
    A.wall = A.ctx.createBiquadFilter(); A.wall.type = "lowpass"; A.wall.frequency.value = 650;
    const dl = A.ctx.createDelay(); dl.delayTime.value = .14;
    const fb = A.ctx.createGain(); fb.gain.value = .28;
    const wet = A.ctx.createGain(); wet.gain.value = .5;
    A.wall.connect(A.master);
    A.wall.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(A.master);
  }
  const s = A.ctx.createBufferSource(); s.buffer = A.noiseBuf;
  const g = A.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
  s.connect(g).connect(A.wall); s.start(t, Math.random()); s.stop(t + .1);
  const o = A.ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .25);
  const og = A.ctx.createGain(); og.gain.setValueAtTime(vol * .9, t); og.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(og).connect(A.wall); o.start(t); o.stop(t + .32);
}
function thud(vol = .6, f0 = 75) {
  if (!A.ctx || A.muted) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(32, t + .5);
  const g = A.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .6);
  o.connect(g).connect(A.master); o.start(t); o.stop(t + .65);
}
function heartbeat(vol = .5) { thud(vol, 65); setTimeout(() => thud(vol * .75, 60), 190); }
function screech() {
  if (!A.ctx || A.muted) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(220, t + .5);
  const f = A.ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 6;
  const g = A.ctx.createGain(); g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + .55);
  o.connect(f).connect(g).connect(A.master); o.start(t); o.stop(t + .6);
}
muteBtn.addEventListener("click", () => {
  A.muted = !A.muted;
  if (A.master) A.master.gain.value = A.muted ? 0 : .8;
  if (A.music) A.music.muted = A.muted;
  muteBtn.textContent = A.muted ? "音效：關" : "音效：開";
});

/* ---------- visuals ---------- */
function setDread(n) { document.body.dataset.dread = String(n); setLevel(n); }
function shake() { if (reduced) return; card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
function flash() { const f = document.getElementById("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }

(function noiseLoop() {
  const cv = document.getElementById("noise"), cx = cv.getContext("2d");
  const img = cx.createImageData(160, 160);
  let last = 0;
  function frame(ts) {
    const lvl = +document.body.dataset.dread || 0;
    if (lvl >= 3 && ts - last > 90 && !reduced) {
      last = ts;
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
      }
      cx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- text helpers ---------- */
async function type(el, text, speed = 65, sound = true) {
  el.textContent = ""; el.classList.add("typing");
  for (const ch of text) {
    el.textContent += ch;
    if (sound && !/[\s，。、：；「」…？！]/.test(ch)) tick();
    await wait(/[，。；？！」]/.test(ch) ? speed * 5 : speed);
  }
  el.classList.remove("typing");
}
function view(html) {
  card.classList.remove("in"); void card.offsetWidth;
  card.innerHTML = html; card.classList.add("in");
  return card;
}
function $(sel) { return card.querySelector(sel); }

function ask({ sub, q, opts, qClass = "" }) {
  view(`
    ${sub ? `<p class="sub">${sub}</p>` : ""}
    <p class="q ${qClass}" id="q">${q}</p>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <p class="fb" id="fb"></p>`);
  return new Promise(res => {
    card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      card.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b.classList.add("sel");
      setTimeout(() => card.querySelectorAll(".opt").forEach(x => { if (x !== b) x.classList.add("gone"); }), 220);
      res({ i, btn: b });
    }));
  });
}
function button(label, cls = "opt center") {
  return new Promise(res => {
    const b = document.createElement("button"); b.className = cls; b.textContent = label;
    b.addEventListener("click", () => { b.disabled = true; res(b); }, { once: true });
    card.append(b); b.focus({ preventScroll: true });
  });
}

async function bloodScreen() {
  const el = document.getElementById("blood");
  el.innerHTML = "";
  const cv = document.createElement("canvas"); cv.width = 120; cv.height = 200; el.append(cv);
  el.hidden = false;
  const cx = cv.getContext("2d"), img = cx.createImageData(120, 200);
  let on = true;
  (function nz() {
    if (!on) return;
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = v; img.data[i+1] = v * .3; img.data[i+2] = v * .3; img.data[i+3] = 255; }
    cx.putImageData(img, 0, 0);
    setTimeout(nz, reduced ? 1000 : 70);
  })();
  const words = ["我沒有", "我沒有", "我沒有", "我沒有。", "我沒有！", "我真的沒有"];
  const area = innerWidth * innerHeight;
  let filled = 0, n = 0;
  heartbeat(.6);
  while (filled < area * 1.15 && n < 260) {
    const sp = document.createElement("span");
    const big = Math.random() < .12;
    const size = big ? 46 + Math.random() * 40 : 16 + Math.random() * 26;
    sp.textContent = words[Math.floor(Math.random() * words.length)];
    sp.style.fontSize = size + "px";
    sp.style.opacity = String(.55 + Math.random() * .45);
    sp.style.marginTop = (Math.random() * 6) + "px";
    sp.style.transform = `rotate(${(Math.random() - .5) * 6}deg)`;
    if (big) sp.className = "big";
    el.append(sp);
    filled += size * size * sp.textContent.length * 1.1;
    n++;
    if (n % 6 === 0) { tick(); }
    if (n % 25 === 0) { heartbeat(.5); }
    if (n === 90) { el.classList.add("flicker"); screech(); }
    await wait(Math.max(12, 70 - n * .6));
  }
  screech(); thud(.9, 80);
  await wait(1600);
  el.classList.remove("flicker");
  el.style.background = "#000";
  el.querySelectorAll("span").forEach(s => s.style.opacity = "0");
  await wait(700);
  on = false;
  el.hidden = true; el.innerHTML = ""; el.style.background = "";
}

/* ---------- the game ---------- */
const TOTAL = 9;
async function game() {
  setDread(0);
  document.getElementById("footer").hidden = false;
  view(`
    <p class="title">內務府太監當差情形調查</p>
    <p class="sub" style="text-align:center">乾隆九年　正月</p>
    <div class="intro">
      <p>為整飭宮禁，凡在宮內當差之太監，均須逐項據實填答。</p>
      <p>本調查將依您的回答調整題目，不同人看到的內容可能不同。</p>
      <p><strong>請獨自作答，作答期間請勿離開畫面。</strong></p>
      <p>請放心，所有供詞，均將妥善存查。</p>
    </div>
    <p class="fb" id="fb" style="text-align:center"></p>
    <p class="sub" style="text-align:center">本遊戲含音效，建議戴耳機遊玩。</p>`);
  await button("【開始作答】");
  initAudio();
  setDread(0);
  $(".intro").style.opacity = ".3";
  await type($("#fb"), "據實以對，自可無事。", 90);
  await wait(1300);

  // Q1
  let r = await ask({ sub: `第 1 題 / 共 ${TOTAL} 題`, q: "您在宮中何處當差？",
    opts: ["A. 養心殿", "B. 翊坤宮", "C. 御膳房", "D. 打掃處"] });
  if (r.i === 0) await type($("#fb"), "好的。養心殿。");
  else {
    await wait(500);
    r.btn.classList.add("glitch"); screech();
    await wait(450); r.btn.textContent = "A. 養心殿"; r.btn.classList.remove("glitch");
    await type($("#fb"), "記錄顯示，您在養心殿當差。");
  }
  await wait(1400);

  // Q2
  r = await ask({ sub: `第 2 題 / 共 ${TOTAL} 題`, q: "您當初淨身入宮，是為了什麼？",
    opts: ["A. 養活父母家人", "B. 求一口飯吃", "C. 不記得了"] });
  await type($("#fb"), r.i === 0 ? "「拋家舍業，淨身進來當差，食錢糧，圖養父母一家。」很好。"
    : r.i === 1 ? "吃宮裡的飯，就要守宮裡的規矩。" : "沒關係。我們會幫您記得。");
  await wait(1500);

  // Q3
  setDread(1);
  r = await ask({ sub: `第 3 題 / 共 ${TOTAL} 題`, q: "每月領的錢糧，夠用嗎？",
    opts: ["A. 夠用", "B. 勉強", "C. 不夠用"] });
  await type($("#fb"), r.i === 0 ? "那就不必去拿不屬於您的東西。"
    : r.i === 1 ? "勉強的人，常常會想辦法讓自己不勉強。" : "不夠用的人，最容易起心動念。已記下。");
  await wait(1500);

  // Q4
  r = await ask({ sub: `第 4 題 / 共 ${TOTAL} 題`, q: "您平日是否吃酒賭錢？",
    opts: ["A. 從不", "B. 偶爾", "C. 只是下棋而已"] });
  await type($("#fb"), r.i === 2 ? "「間或下棋尚可。」" : r.i === 0 ? "每個人都這麼說。" : "近來太監吃酒賭錢者甚多。您知道的。");
  await wait(1500);

  // Q5
  setDread(2);
  r = await ask({ sub: `第 5 題 / 共 ${TOTAL} 題`, q: "正月十八日，您在哪裡？",
    opts: ["A. 在殿內當差", "B. 在值房休息", "C. 記不清楚了"] });
  await wait(700);
  await type($("#fb"), "有人說，那天您一個人進過內庫。", 85);
  heartbeat(.35);
  await wait(1800);

  // Q6
  setDread(3);
  r = await ask({ sub: `第 6 題 / 共 ${TOTAL} 題`, q: "「正月十八日，您一個人進過內庫，對吧？」",
    opts: ["是", "否"] });
  if (r.i === 0) {
    await wait(500);
    await type($("#fb"), "我們不需要您承認。", 90);
    await wait(700);
    await type($("#fb"), "已經有人指認您了。", 95);
  } else {
    await type($("#fb"), "已經有人指認您了。", 95);
  }
  $("#fb").classList.add("red");
  thud(.5);
  await wait(1500);
  setDread(4);
  await bloodScreen();

  // Q7 — 夾訊
  setDread(4);
  view(`
    <p class="sub glitch" id="sub">第 7 題 / 共 ? 題</p>
    <p class="fb" id="pre"></p>
    <p class="q brush red breathe" id="q" style="font-size:24px;text-align:center">請再想一想。</p>
    <div id="echo" class="fb red" style="text-align:center;min-height:0"></div>`);
  await type($("#pre"), "內務府總管依據供詞，對您動用夾訊。", 80);
  await wait(600);
  const labels = ["我沒有", "我沒有。", "我真的沒有", "我沒……", "我……"];
  for (let k = 0; k < labels.length; k++) {
    const b = await button(labels[k]);
    shake(); flash(); heartbeat(.45 + k * .1);
    b.remove();
    const e = document.createElement("div");
    e.textContent = "請再想一想。"; e.className = "brush";
    e.style.fontSize = (15 + k * 3) + "px"; e.style.opacity = String(.4 + k * .15);
    $("#echo").append(e);
    await wait(650 - k * 60);
  }
  setDread(5);
  await wait(500);
  view(`<p class="seal-big">堅不招承</p><p class="fb" id="fb" style="text-align:center"></p>`);
  thud(.9, 90);
  await wait(900);
  await type($("#fb"), "您始終沒有招認。", 90);
  await wait(2200);

  // Q8 — silence
  setDread("white");
  if (A.ctx) { A.drone.gain.setTargetAtTime(0, A.ctx.currentTime, .05); A.hiss.gain.setTargetAtTime(0, A.ctx.currentTime, .05); }
  document.getElementById("footer").hidden = true;
  view(`<p class="sub" id="sub"></p><p class="q" id="l1"></p><p class="q" id="l2"></p><p class="q" id="l3"></p><p class="q" id="l4"></p>`);
  await wait(1800);
  await type($("#l1"), "二月十七日。", 140); await wait(900);
  await type($("#l2"), "外養心殿值房。", 140); await wait(900);
  await type($("#l3"), "張玉床下。", 160); await wait(1100);
  await type($("#l4"), "銀一百兩。", 200); thud(.7, 60);
  await wait(2200);
  const p = document.createElement("p"); p.className = "fb"; card.append(p);
  await type(p, "您可以回去了。", 110);
  await wait(600);
  await button("回去");

  // Q9 — 跪聽上諭
  setDread(4);
  document.getElementById("footer").hidden = false;
  view(`
    <p class="sub">第 9 題 / 共 ${TOTAL} 題</p>
    <p class="q" id="q"></p>`);
  await type($("#q"), "所有養心殿太監，帶至院內，跪聽上諭。", 80);
  await wait(500);
  await button("跪下");
  thud(.6, 55);
  view(`
    <p class="seal-big" style="font-size:40px">上諭</p>
    <p class="quote" id="a"></p><p class="quote" id="b"></p><p class="quote red" id="c"><span id="c1"></span><span id="c2"></span></p>
    <p class="fb" id="d"></p>`);
  await wait(900);
  await type($("#a"), "爾等拋家舍業，淨身進來當差，食錢糧，圖養父母一家，學做好人才是，如何做起賊來？", 70);
  await wait(900);
  await type($("#b"), "今張玉竟將內庫鎖頭擰脫，將銀偷去。如此膽大之人，復何事不可為？", 70);
  await wait(900);
  // distant caning while the line is written, then silence
  let hits = 0, gap = 520, caning = true;
  (async () => {
    while (caning) {
      cane(.75 - hits * .025); hits++;
      if (hits % 2) { shake(); flash(); }
      await wait(gap); gap += 45;
    }
  })();
  await type($("#c1"), "已將張玉立斃杖下，", 150);
  await wait(3200);
  caning = false;
  fadeMusic(0, 600);
  if (A.ctx) { A.drone.gain.setTargetAtTime(0, A.ctx.currentTime, .1); A.hiss.gain.setTargetAtTime(0, A.ctx.currentTime, .1); }
  await wait(1700);
  await type($("#c2"), "與爾等嚴示榜樣。", 160);
  await wait(1200);
  setDread(4);
  await type($("#d"), "張玉被帶到甕山，當著圈禁太監的面杖斃。", 70);
  await wait(1800);
  await button("……");

  // reveal
  setDread(5);
  view(`<p class="q" id="a" style="text-align:center;font-size:22px"></p><p class="quote red" id="b" style="text-align:center"></p>`);
  await wait(1200);
  await type($("#a"), "您是曾祿。", 220);
  heartbeat(.6);
  await wait(1600);
  await type($("#b"), "「如搜檢稍遲，曾祿命亦難保，豈不枉屈平人？」", 85);
  await wait(1500);
  await button("閱覽卷宗");

  dossier();
}

function dossier() {
  setDread(1);
  if (A.ctx) { A.drone.gain.setTargetAtTime(A.music ? 0 : .02, A.ctx.currentTime, 1.5); }
  fadeMusic(.05, 3000);
  window.scrollTo(0, 0);
  view(`
    <div class="dossier">
      <p class="sub">卷宗　乾隆九年正月至二月</p>
      <h2>養心殿內庫失竊案</h2>
      <p>您剛才扮演的，是太監<strong>曾祿</strong>。這份「調查」是遊戲的改編，但案件是真的，記載在乾隆年間官修的《國朝宮史》〈訓諭〉裡。</p>

      <h3>案件經過</h3>
      <ol>
        <li><strong>乾隆九年初</strong>　養心殿內庫的銀兩被偷。小偷沒有用鑰匙，而是把內庫的鎖頭「擰脫」。</li>
        <li><strong>二月初四日</strong>　張永泰傳旨，乾隆寫給總管謝成、劉玉：「太監中竟有做賊之人，皆因爾總管等平日不加約束，又不稽查之故。」他也指出各處只靠首領管理，出事時「彼此相推諉」。總管潘鳳、首領寇明等「罪無可逭」。當班坐更的太監被交出審問，乾隆下令查明失竊日期，看當天是周世輔、石貴當班，還是王太平、潘鳳當班，就辦誰的罪。</li>
        <li><strong>慎刑司審問</strong>　太監韓世忠供稱，曾祿正月十八日一個人進過內庫。內務府總管依據這句口供，對曾祿動用夾訊，連乾隆也「不能不疑及曾祿」。但曾祿<strong>堅不招承</strong>。</li>
        <li><strong>二月十七日</strong>　乾隆「惟恐搜查不細」，命總管倉州傳旨，要謝成、倉州帶司房太監和內養心殿太監，到外養心殿太監值房「細細搜查，不得徇情隱蔽」。結果在<strong>太監張玉床下搜出銀一百兩</strong>。又依張玉口供，在太監張吉德櫃內搜出碎銀一包。乾隆也提到，潘鳳從南海子回來後曾和王太平一起搜查，卻「竟未搜出」，審明後兩人一併治罪。</li>
        <li><strong>同日</strong>　總管潘鳳、首領李金、徐文耀、太監王坤連同一百兩銀子送交慎刑司，由莊親王與內務府總管來保、海望、傅恆審辦。乾隆特別交代，不要讓在外受審的首領寇明等人知道這件事，由內務府總管另行審問。</li>
        <li><strong>處置原則</strong>　乾隆下令此案「不必交三法司」，審明後把為首、為從的人押到城外，「傳齊眾太監觀看正法」。原本被扣押的曹進孝、張常保放回；曾祿也釋放回家，養好傷再進宮當差。</li>
        <li><strong>獎賞</strong>　搜回的一百兩不入庫，謝成、倉州各賞二十五兩，其餘五十兩賞給搜銀的太監。之後追回的贓銀，賞給曹進孝、張常保、曾祿，其中曾祿「加厚賞給」。</li>
        <li><strong>二月二十二日</strong>　乾隆下令隔天將張玉帶到甕山，當著那裡圈禁的太監面前<strong>杖斃</strong>，比照甕山永不釋放太監病故的方式掩埋，並派內務府主事一員同往。養心殿太監和隨侍各處首領，都被帶到養心殿院內<strong>跪聽上諭</strong>。</li>
        <li><strong>誣告者</strong>　乾隆認為韓世忠「信口妄供，圖為自己卸過」，差點害死曾祿。韓世忠從重責處，發往打掃處當差，<strong>永不挑補</strong>。</li>
        <li><strong>最後一道上諭</strong>　乾隆說近來太監吃酒賭錢的很多，都是總管不管束的緣故，「間或下棋尚可」。這次姑且從寬不追究，以後再犯，本人照例處分，總管也決不輕饒。</li>
      </ol>

      <h3>上諭原文</h3>
      <p class="orig">「爾等拋家舍業，淨身進來當差，食錢糧，圖養父母一家，學做好人才是，如何做起賊來？」</p>
      <p class="orig">「如搜檢稍遲，曾祿命亦難保，豈不枉屈平人？」</p>
      <p class="orig">「如果偷竊銀兩回家養贍父母、兄弟，尚屬可恕，今之偷盜不過吃酒賭錢花費而已。」</p>

      <h3>從這個案子看到什麼</h3>
      <ol>
        <li><strong>先追究管理的人</strong>：小偷還沒抓到，乾隆就先罵總管不約束、不稽查。最後被送進慎刑司的，除了偷錢的人，還有總管和首領。</li>
        <li><strong>口供不一定可靠</strong>：一句「正月十八日獨自入庫」，就讓曾祿受了夾訊。要不是乾隆下令再搜，真正的小偷可能就逃過了。</li>
        <li><strong>殺雞儆猴</strong>：不交三法司、在甕山杖斃、全體跪聽上諭，都是做給其他太監看的。</li>
        <li><strong>偷錢的原因</strong>：乾隆認為只是吃酒賭錢，學者張書銘則認為，俸祿微薄、要貼補家庭才是重要原因。您怎麼看？</li>
      </ol>

      <p class="small">改編說明：「當差情形調查」問卷、題目與回饋文字都是遊戲改編，不是檔案原文；以曾祿視角敘事為想像，「我沒有」也是想像的內心話。楷書引號內的文字，出自上諭原文。</p>
      <p class="small">出處：〔清〕鄂爾泰、張廷玉等編，《國朝宮史》，卷四，〈訓諭〉，乾隆九年二月初四日至二月二十二日。張書銘，〈乾隆朝皇室財政監管與案件懲處〉。</p>
    </div>`);
  button("重新作答").then(() => game());
}

game();
</script>

</body>
</html>
